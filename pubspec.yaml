name: my_tasks
description: "My Tasks: a fast, private to-do app for Android, iOS, web, Windows, macOS and Linux."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.0
  timezone: ">=0.10.0 <0.12.0"
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# App icons for every platform: run `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#6D4AE8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  image_path_ios: "assets/icon/app_icon_square.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#6D4AE8"
    theme_color: "#7C3AED"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
